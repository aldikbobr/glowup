<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F52E0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Глоу Ап">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui;background:#F2F4F9}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Проект Глоу Ап</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#F7F8FC; --ink:#131A31; --muted:#5A6380; --line:#DCE1EC;
  --grid:rgba(47,82,224,.08);
  --accent:#2F52E0; --accent-ink:#FFFFFF; --accent-soft:#E4EAFF; --hot:#E8561F; --ok:#1E9A60; --warn:#B7791F;
  --c-sleep:#6A5AE0; --c-food:#C27A00; --c-sport:#2F52E0; --c-care:#0B8C98; --c-style:#C2417A; --c-mind:#7B61C9; --c-prog:#1E9A60;
  --shadow:0 1px 2px rgba(19,26,49,.05),0 6px 20px rgba(19,26,49,.06);
  --font-d:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-b:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1120; --surface:#141B2E; --surface-2:#10172A; --ink:#E7EBF7; --muted:#97A1BF; --line:#263050;
    --grid:rgba(126,155,255,.07);
    --accent:#7E9BFF; --accent-ink:#0C1120; --accent-soft:#1D2750; --hot:#FF855A; --ok:#3DCB8A; --warn:#E5B04A;
    --c-sleep:#A396FF; --c-food:#F0B23A; --c-sport:#7E9BFF; --c-care:#3CCFD9; --c-style:#F07AAE; --c-mind:#B7A2FF; --c-prog:#3DCB8A;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1120; --surface:#141B2E; --surface-2:#10172A; --ink:#E7EBF7; --muted:#97A1BF; --line:#263050;
  --grid:rgba(126,155,255,.07);
  --accent:#7E9BFF; --accent-ink:#0C1120; --accent-soft:#1D2750; --hot:#FF855A; --ok:#3DCB8A; --warn:#E5B04A;
  --c-sleep:#A396FF; --c-food:#F0B23A; --c-sport:#7E9BFF; --c-care:#3CCFD9; --c-style:#F07AAE; --c-mind:#B7A2FF; --c-prog:#3DCB8A;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
.wrap{max-width:580px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:18px}
.view{display:flex;flex-direction:column;gap:18px;min-width:0}
h1,h2,h3{font-family:var(--font-d);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:22px}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* top */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top .eyebrow{margin-bottom:4px}
.daynav{display:flex;align-items:center;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* hero card – тетрадь в клетку */
.hero{position:relative;border-radius:18px;background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:18px 18px;border:1px solid var(--line);box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line);fill:none;stroke-width:9}
.ring .bar{stroke:var(--accent);fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .pct{font-family:var(--font-d);font-size:24px;font-weight:700;line-height:1}
.ring .sub{font-size:11px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.stat .v{font-family:var(--font-d);font-size:20px;font-weight:700;line-height:1.1;display:flex;align-items:center;gap:6px}
.stat .k{font-size:12px;color:var(--muted)}
.flame{width:18px;height:18px;fill:var(--hot)}
.hero .next{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hero .next b{font-family:var(--font-d);font-size:14px}

/* water */
.water{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.water .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cups{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.cup{aspect-ratio:3/4;max-width:100%;border-radius:6px 6px 9px 9px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;position:relative;overflow:hidden;padding:0}
.cup::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:var(--c-care);opacity:.85;transition:height .25s}
.cup.on{border-color:var(--c-care)}
.cup.on::after{height:78%}
.cup.bonus{border-style:dashed}

/* tasks */
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tasks{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task{display:grid;grid-template-columns:48px 1fr 40px;gap:10px;align-items:start;padding:12px 12px 12px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:none}
.task .time{font-family:var(--font-d);font-size:12px;font-weight:500;padding-top:3px;color:var(--muted)}
.task .t{font-weight:600;line-height:1.3}
.task .d{font-size:13px;color:var(--muted);margin-top:2px}
.task .meta{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--dot,var(--muted));display:inline-block}
.more{font-size:12px;font-weight:600;background:none;border:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0;justify-self:end}
.check svg{width:18px;height:18px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0;stroke-linecap:round;stroke-linejoin:round}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.task.done .check svg{opacity:1}
.task.done .t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.task.now{background:var(--accent-soft)}
.task.now .time{color:var(--accent)}
.nowtag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:1px 6px}
.check:disabled{cursor:default;opacity:.5}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.soft{background:var(--surface-2)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{background:#1F9D55;border-color:#1F9D55;color:#fff}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--hot);border-color:var(--hot)}
ul.clean,ol.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ul.clean li::marker{color:var(--accent)}
ol.clean li::marker{color:var(--accent);font-family:var(--font-d);font-size:12px}
.note{font-size:13px;border-left:3px solid var(--warn);padding:8px 12px;background:var(--surface-2);border-radius:0 8px 8px 0}
.note.red{border-color:var(--hot)}
.note.ok{border-color:var(--ok)}

/* sub tabs */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.prose{display:flex;flex-direction:column;gap:14px}
.prose .lead{font-size:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.kv dt{font-weight:600}
.kv dd{margin:0;color:var(--muted)}

/* exercises */
.ex{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:none;padding-top:0}
.ex .n{font-family:var(--font-d);font-size:13px;color:var(--accent);padding-top:2px}
.ex .nm{font-weight:600}
.ex .sets{font-family:var(--font-d);font-size:12px;color:var(--ink);background:var(--accent-soft);border-radius:6px;padding:2px 8px;display:inline-block;margin-top:4px}
.ex .cue{font-size:13px;color:var(--muted);margin-top:6px}
.ex label{font-size:12px;color:var(--muted);display:block;margin-top:8px}
input[type=text],input[type=number],input[type=date],input[type=tel],textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical;font-size:12px}

/* food */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .v{font-family:var(--font-d);font-size:19px;font-weight:700}
.tile .k{font-size:12px;color:var(--muted)}
.meal{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.meal:first-child{border-top:none;padding-top:0}
.meal .time{font-family:var(--font-d);font-size:12px;color:var(--muted)}
.meal .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-food);font-weight:700}
.meal .nm{font-weight:500}
.meal .hint{font-size:12px;color:var(--muted)}
.meal .kc{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.totals{display:flex;gap:14px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:10px;font-weight:600}
.shop{display:flex;flex-direction:column;gap:2px}
.shop label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.shop input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:0 0 auto}
.shop .q{color:var(--muted);font-size:13px}
.shop label.got span{text-decoration:line-through;color:var(--muted)}

/* progress */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-b)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.heat{display:grid;grid-template-columns:22px repeat(7,1fr);gap:4px;font-size:10px;color:var(--muted)}
.heat .c{aspect-ratio:1;border-radius:4px;background:var(--line);max-width:100%}
.heat .c.l1{background:var(--accent);opacity:.3}
.heat .c.l2{background:var(--accent);opacity:.6}
.heat .c.l3{background:var(--accent)}
.heat .c.fut{background:transparent;border:1px dashed var(--line)}
.heat .c.today{outline:2px solid var(--ink);outline-offset:1px}
.mlist{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.mrow:first-child{border-top:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* reminders */
.rem{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.rem:first-child{border-top:none;padding-top:0}
.rem .time{font-family:var(--font-d);font-size:13px;font-weight:700;padding-top:1px}
.rem .days{font-size:12px;color:var(--muted)}
.rem .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.rem .added{font-size:12px;color:var(--ok);font-weight:600}

/* speech */
.sp-now{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sp-name{font-family:var(--font-d);font-size:17px;font-weight:700}
.sp-count{font-family:var(--font-d);font-size:40px;font-weight:700;color:var(--accent);line-height:1}
.sp-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.sp-bar i{display:block;height:100%;background:var(--accent);transition:width .9s linear}
.sp-tw{margin:0;font-family:var(--font-d);font-weight:500;font-size:17px;line-height:1.45;padding:14px 16px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.sp-text{font-size:16px;line-height:1.65;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--surface-2)}
.sp-plus{min-height:56px;flex:1 1 auto}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabbar .in{max-width:580px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{background:none;border:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.hero{grid-template-columns:1fr;justify-items:center}.stats{width:100%}}
</style>
</head>

const KEY = 'glowup.v1';
let storageOK = true;
function todayKey(){ return keyOf(new Date()); }
function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); return x; }
function diffDays(a,b){ return Math.round((parseKey(keyOf(b))-parseKey(keyOf(a)))/86400000); }

const DEFAULT = {name:'',start:todayKey(),phone:'',days:{},measures:[],logs:{},shop:{},remind:{},dad:'',mom:'',ui:{tab:'today',plan:'grow',menu:null}};
let S;
function load(){
  let raw=null;
  try{ raw = localStorage.getItem(KEY); }catch(e){ storageOK=false; }
  try{ S = raw ? Object.assign({}, DEFAULT, JSON.parse(raw)) : JSON.parse(JSON.stringify(DEFAULT)); }catch(e){ S = JSON.parse(JSON.stringify(DEFAULT)); }
  S.ui = Object.assign({}, DEFAULT.ui, S.ui||{});
  if(!S.name) S.name='Алдик';
  if(!S.dad) S.dad='182';
  if(!S.mom) S.mom='166';
  if(!S.gym) S.gym={};
  if(!S.speech) S.speech={tw:{},wpm:[],par:[]};
  if(!raw) save();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ storageOK=false; document.getElementById('storeWarn').hidden=false; } }

function scoreFor(date){
  const k=keyOf(date), dd=dayData(k), T=tasksFor(date);
  let done=T.filter(t=>dd.d[t.id]).length + (dd.w>=8?1:0);
  const total=T.length+1;
  return {done,total,pct:Math.round(done/total*100)};
}
function streak(){
  const start=parseKey(S.start); let d=new Date(); d=parseKey(keyOf(d)); let n=0;
  if(scoreFor(d).pct>=80) n++;
  d=addDays(d,-1);
  while(d>=start && scoreFor(d).pct>=80){ n++; d=addDays(d,-1); }
  return n;
}

      <ul class="clean">
        <li><b>Цель — 8,5 часов:</b> отбой в 22:15, подъём в 06:50. Гормон роста выделяется в основном в глубоком сне в первые часы ночи. Сейчас засыпание около 00:00 — это меньше 7 часов.</li>
        <li><b>Переход плавный:</b> неделя 1 — отбой в 23:30, неделя 2 — 23:00, неделя 3 — 22:30, дальше — 22:15. В пятницу и субботу можно на 30 минут позже. В распорядке время меняется само.</li>

        <li>Никаких энергетиков. Чай и кофе — только до 14:00.</li>

    </div>
    <div class="card">
      <h3>2. Еда — строительный материал</h3>
      <ul class="clean">
        <li>Хватает калорий: недоедание тормозит рост сильнее всего. Меню — во вкладке «Еда».</li>
        <li>Кальций: 3 порции молочного в день (молоко, кефир, айран, творог, сыр).</li>
        <li>Витамин D: с октября по апрель солнца мало. Сдать анализ «25(OH)D» и спросить педиатра про дозировку — сами не назначаем.</li>

      <h3>3. Движение</h3>

        <li>Силовые с правильной техникой рост не останавливают — это миф. Они укрепляют кости.</li>
        <li>Баскетбол, волейбол, плавание, футбол — отличные дополнения в субботу.</li>
        <li>Вис на турнике 2–3 раза по 20–30 секунд после каждой тренировки разгружает позвоночник.</li>
      </ul>
    </div>
    <div class="card">
      <h3>4. Осанка</h3>
      <p>Ровная спина добавляет 2–3 см визуально сразу. Комплекс — в разделе «Осанка».</p>
    </div>
    <div class="card">
      <h3>Как правильно мерить</h3>
      <ol class="clean">
        <li>Раз в месяц, в первое воскресенье, утром сразу после подъёма. Вечером человек ниже на 1–2 см.</li>
        <li>Без обуви, пятки, ягодицы, лопатки и затылок — к стене.</li>
        <li>Книгу или линейку на макушку, отметка карандашом, мерить рулеткой.</li>

    </div>

gym:()=>{

hair:()=>`

  </div>`,

let delArm=null, restoreArm=false;
function lineChart(points,key,unit,color){
  const pts=points.filter(p=>p[key]!=null && p[key]!=='' && !isNaN(p[key]));
  if(pts.length<2) return `<p class="small muted">Нужно минимум 2 замера — график появится после второго воскресенья.</p>`;
  const W=320,H=150,L=34,R=10,T=12,B=26;
  const vals=pts.map(p=>+p[key]); let mn=Math.min(...vals), mx=Math.max(...vals);
  const pad=Math.max((mx-mn)*0.15, key==='height'?1:0.5); mn-=pad; mx+=pad;
  const t0=parseKey(pts[0].date).getTime(), t1=parseKey(pts[pts.length-1].date).getTime(); const span=Math.max(t1-t0,1);
  const x=t=>L+(W-L-R)*((t-t0)/span), y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const ticks=[mn+(mx-mn)*0.1, (mn+mx)/2, mx-(mx-mn)*0.1];
  const path=pts.map((p,i)=>(i?'L':'M')+x(parseKey(p.date).getTime()).toFixed(1)+' '+y(+p[key]).toFixed(1)).join(' ');
  const area=path+` L${x(t1).toFixed(1)} ${H-B} L${x(t0).toFixed(1)} ${H-B} Z`;
  const last=pts[pts.length-1];
  const d0=parseKey(pts[0].date), d1=parseKey(last.date);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График: ${unit}">
    ${ticks.map(v=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${fmtNum(v)}</text>`).join('')}
    <path d="${area}" style="fill:${color}" opacity=".12"/>
    <path class="ln" d="${path}" style="stroke:${color}"/>
    ${pts.map(p=>`<circle cx="${x(parseKey(p.date).getTime()).toFixed(1)}" cy="${y(+p[key]).toFixed(1)}" r="2.5" style="fill:${color}"/>`).join('')}
    <circle cx="${x(t1).toFixed(1)}" cy="${y(+last[key]).toFixed(1)}" r="5" style="fill:${color};stroke:var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H-8}" text-anchor="start">${d0.getDate()}.${String(d0.getMonth()+1).padStart(2,'0')}</text>
    <text x="${W-R}" y="${H-8}" text-anchor="end">${d1.getDate()}.${String(d1.getMonth()+1).padStart(2,'0')}</text>
  </svg>`;
}
function heatmap(){
  const today=parseKey(todayKey()); const start=parseKey(S.start);
  const dowMon=(today.getDay()+6)%7; const lastMon=addDays(today,-dowMon); const first=addDays(lastMon,-7*7);
  let h='<div class="heat"><span></span>'+['пн','вт','ср','чт','пт','сб','вс'].map(d=>`<span style="text-align:center">${d}</span>`).join('');
  for(let w=0;w<8;w++){
    const wd=addDays(first,w*7); h+=`<span class="num" style="align-self:center">${wd.getDate()}</span>`;
    for(let i=0;i<7;i++){
      const d=addDays(wd,i);
      if(d>today){ h+='<span class="c fut"></span>'; continue; }
      if(d<start){ h+='<span class="c" style="opacity:.35"></span>'; continue; }
      const p=scoreFor(d).pct; const l=p>=80?'l3':p>=50?'l2':p>0?'l1':'';
      h+=`<span class="c ${l} ${keyOf(d)===keyOf(today)?'today':''}" title="${fmtDate(d)}: ${p}%"></span>`;
    }
  }
  return h+'</div>';
}

function nextDateFor(r){
  const t=parseKey(todayKey());
  for(let i=1;i<=7;i++){ const d=addDays(t,i); if(r.days==='DAILY' || r.days.some(c=>DAYCODE[c]===d.getDay())) return d; }
  return addDays(t,1);
}
function gcalLink(r){
  const d=nextDateFor(r); const [h,m]=r.time.split(':').map(Number);
  const s=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m); const e=new Date(s.getTime()+r.dur*60000);
  const f=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00';
  const rr = r.days==='DAILY' ? 'RRULE:FREQ=DAILY' : 'RRULE:FREQ=WEEKLY;'+(r.interval?'INTERVAL='+r.interval+';':'')+'BYDAY='+r.days.join(',');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Глоу ап: '+r.t)+'&details='+encodeURIComponent(r.d)+'&dates='+f(s)+'/'+f(e)+'&recur='+encodeURIComponent(rr);
}
function daysLabel(r){
  if(r.days==='DAILY') return 'каждый день';
  const s=r.days.join(',');
  if(s==='MO,TU,WE,TH,FR') return 'пн–пт';
  return (r.interval?'раз в '+r.interval+' недели, ':'')+r.days.map(c=>DAYNAME_SHORT[c]).join(', ');
}

    <p class="small muted">Бери любой текст из блока «Темп речи» ниже. Один приём в день, по кругу.</p>
    <dl class="kv">
      <dt>Шёпотом</dt><dd>Прочитай текст громким шёпотом так, чтобы было слышно в другом конце комнаты. Без голоса работают только губы и язык — согласные становятся чёткими.</dd>
      <dt>С ручкой</dt><dd>Зажми зубами чистую ручку поперёк, прочитай абзац, стараясь, чтобы было понятно. Сразу же — без ручки. Разница слышна с первого раза.</dd>
      <dt>Одни согласные</dt><dd>Читай предложение, произнося только согласные и пропуская гласные. Язык и губы работают на пределе.</dd>
      <dt>Как через стекло</dt><dd>Читай, преувеличенно открывая рот, как будто тебя слышат через окно и понимают только по губам.</dd>
      <dt>Слоги с хлопком</dt><dd>Каждый слог — хлопок в ладоши. Сначала медленно, потом всё быстрее, пока не станет обычной речью.</dd>
    </dl>
  </div>
  <div class="eyebrow" style="margin-top:4px">Речь · уверенность в разговоре</div>
  <div class="card" id="sp-par">${parHTML()}</div>
  <div class="card" id="sp-rd">${rdHTML()}</div>
  <div class="card" id="sp-q">${qHTML()}</div>
  <div class="card">
    <h3>Как вести разговор</h3>
    <dl class="kv">
      <dt>Открытые вопросы</dt><dd>Не «Тебе нравится музыка?» (ответ «да» — и тишина), а «Что ты сейчас слушаешь?».</dd>
      <dt>Ответ + вопрос</dt><dd>Ответил — спроси то же самое у собеседника: «А ты?»</dd>
      <dt>Зацепки</dt><dd>Лови детали: «Я была в Алматы» → «О, а что там понравилось больше всего?»</dd>
      <dt>Слушай</dt><dd>Не перебивай и не жди своей очереди — реагируй на то, что услышал.</dd>
      <dt>Истории</dt><dd>Коротко, 30–60 секунд: что было → что случилось → чем закончилось.</dd>
      <dt>Юмор</dt><dd>Без подколов и унижений. Посмеяться над собой — можно.</dd>
      <dt>Как закончить</dt><dd>Тоже навык: «Ладно, мне на английский. Потом расскажешь, чем закончилось!»</dd>
    </dl>
  </div>
  <div class="card soft">
    <h3>Голос</h3>
    <ul class="clean">
      <li>Говори на выдохе и чуть медленнее обычного — голос звучит ниже и спокойнее.</li>
      <li>Раз в неделю запиши голосовое на 1 минуту о своём дне и послушай: темп, паразиты, чёткость. Сравни с первой записью через месяц.</li>
      <li>Голос сейчас ломается — это нормально. Не кричи и не пытайся специально басить, пей воду.</li>
    </ul>
  </div>
  <div class="note ok">Лучший тренажёр — живые разговоры: с семьёй за ужином, с друзьями, на английском, в магазине. С девочкой, которая нравится, работают те же правила: будь собой, спрашивай про её интересы, слушай ответы и уважай их. Уверенность приходит от практики со всеми людьми, а не только в важных разговорах.</div>`;
}
function speechAct(act,v){
  if(act==='sp-stop'){ spStop(); ['sp-wu','sp-par','sp-q','sp-rd'].forEach(spRefresh); return; }
  if(act==='sp-wu-start'){ spStop(); WU={on:true,i:0,left:WARMUP[0].s}; beep(); spRefresh('sp-wu');
    spTimer=setInterval(()=>{ WU.left--; if(WU.left<=0){ WU.i++; beep(); if(WU.i>=WARMUP.length){ spStop(); spRefresh('sp-wu'); markSpeech(); toast('Разминка готова — теперь скороговорки'); return; } WU.left=WARMUP[WU.i].s; } spRefresh('sp-wu'); },1000); return; }
  if(act==='sp-wu-skip'){ WU.i++; if(WU.i>=WARMUP.length){ spStop(); spRefresh('sp-wu'); markSpeech(); return; } WU.left=WARMUP[WU.i].s; beep(); spRefresh('sp-wu'); return; }
  if(act==='sp-snd'){ S.ui.snd=+v; save(); spRefresh('sp-snd'); return; }
  if(act==='sp-snd-ok'){ const x=SOUNDS[soundIdx()]; S.speech.snd=S.speech.snd||{}; S.speech.snd[x.id]=(S.speech.snd[x.id]||0)+1; save(); toast('Засчитано'); spRefresh('sp-snd'); return; }
  if(act==='sp-tw-lv'){ TWs={lv:v,i:0}; spRefresh('sp-tw'); return; }
  if(act==='sp-tw-next'){ TWs.i++; spRefresh('sp-tw'); return; }
  if(act==='sp-tw-ok'){ const L=TWISTERS[TWs.lv], id=TWs.lv+(TWs.i%L.length); S.speech.tw[id]=(S.speech.tw[id]||0)+1; save(); toast('Засчитано'); spRefresh('sp-tw'); return; }
  if(act==='sp-rd-text'){ if(RD.on) return; RD={i:+v,on:false,t0:0,res:null}; spRefresh('sp-rd'); return; }
  if(act==='sp-rd-toggle'){
    if(!RD.on){ RD.on=true; RD.res=null; RD.t0=Date.now(); spRefresh('sp-rd'); return; }
    const sec=(Date.now()-RD.t0)/1000; RD.on=false;
    if(sec<8){ toast('Слишком быстро — прочитай весь текст вслух'); spRefresh('sp-rd'); return; }
    RD.res=Math.round(wordsIn(READ_TEXTS[RD.i].x)/(sec/60)); S.speech.wpm=(S.speech.wpm||[]).concat([{d:todayKey(),w:RD.res}]).slice(-20); save(); spRefresh('sp-rd'); return; }
  if(act==='sp-par-topic'){ PAR.ti=Math.floor(Math.random()*TOPICS.length); PAR.res=null; spRefresh('sp-par'); return; }
  if(act==='sp-par-start'){ spStop(); PAR.on=true; PAR.left=60; PAR.n=0; PAR.res=null; beep(); spRefresh('sp-par');
    spTimer=setInterval(()=>{ PAR.left--; if(PAR.left<=0){ PAR.res=PAR.n; S.speech.par=(S.speech.par||[]).concat([{d:todayKey(),n:PAR.n}]).slice(-20); save(); spStop(); beep(); spRefresh('sp-par'); markSpeech(); return; } spRefresh('sp-par'); },1000); return; }
  if(act==='sp-par-plus'){ if(PAR.on){ PAR.n++; spRefresh('sp-par'); } return; }
  if(act==='sp-q-next'){ Q.i=Math.floor(Math.random()*QUESTIONS.length); spRefresh('sp-q'); return; }
  if(act==='sp-q-start'){ spStop(); Q.on=true; Q.left=30; beep(); spRefresh('sp-q');
    spTimer=setInterval(()=>{ Q.left--; if(Q.left<=0){ spStop(); beep(); toast('Теперь 2 вопроса в ответ'); spRefresh('sp-q'); return; } spRefresh('sp-q'); },1000); return; }
}

/* ================= НАВИГАЦИЯ И СОБЫТИЯ ================= */
const TABS=['today','plan','speech','food','progress','remind'];
function show(tab){
  if(!TABS.includes(tab)) tab='today';
  S.ui.tab=tab; save();
  TABS.forEach(t=>{ $('#tab-'+t).hidden = t!==tab; });
  document.querySelectorAll('.tabbar button').forEach(b=>{ if(b.dataset.tab===tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(tab!=='speech') spStop();
  ({today:renderToday,plan:renderPlan,speech:renderSpeech,food:renderFood,progress:renderProgress,remind:renderRemind})[tab]();
}
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tabbar button'); if(tb){ if(tb.dataset.tab==='today') viewDate=parseKey(todayKey()); show(tb.dataset.tab); window.scrollTo(0,0); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, v=a.dataset.v;
  if(act.indexOf('sp-')===0){ speechAct(act,v); return; }
  if(act==='toggle'){ const k=keyOf(viewDate); const dd=ensureDay(k); dd.d[v]=!dd.d[v]; if(!dd.d[v]) delete dd.d[v]; save(); const y=window.scrollY; renderToday(); window.scrollTo(0,y); const sc=scoreFor(viewDate); if(dd.d[v] && sc.pct>=80 && sc.pct-Math.round(1/sc.total*100)<80) toast('80% — день засчитан, серия растёт'); }
  else if(act==='chswap'){
    const k=keyOf(viewDate), dd=ensureDay(k), cur=challengeIdx(viewDate), we=viewDate.getDay()===0||viewDate.getDay()===6;
    let n=cur, guard=0; while((n===cur || (we && SCHOOL_CH.includes(n)) || (S.chSkip||[]).includes(n)) && guard<100){ n=Math.floor(Math.random()*CHALLENGES.length); guard++; }
    dd.ch=n; save(); const y=window.scrollY; renderToday(); window.scrollTo(0,y); toast('Новый челлендж на сегодня');
  }
  else if(act==='remhide'){ S.remindHide=true; save(); renderToday(); toast('Напоминания — колокольчик вверху'); }
  else if(act==='water'){ const k=keyOf(viewDate); const dd=ensureDay(k); const n=+v; dd.w = (dd.w===n)? n-1 : n; save(); const y=window.scrollY; renderToday(); window.scrollTo(0,y); }
  else if(act==='back'){ viewDate=parseKey(todayKey()); show('today'); window.scrollTo(0,0); }
  else if(act==='day'){ const n=+v; viewDate = n===0? parseKey(todayKey()) : addDays(viewDate,n); renderToday(); }
  else if(act==='go'){ if(v==='speech'||v==='remind'){ show(v); } else if(v==='food'){ S.ui.menu=DOW_KEYS[viewDate.getDay()]; show('food'); } else if(v==='progress'){ show('progress'); } else { S.ui.plan=v; show('plan'); } window.scrollTo(0,0); }
  else if(act==='plan'){ S.ui.plan=v; save(); renderPlan(); }
  else if(act==='gymday'){ S.ui.gymDay=+v; save(); const y=window.scrollY; renderPlan(); window.scrollTo(0,y); }
  else if(act==='gymadd'){ const L=gymList(+v); L.push({id:'g'+v+'_'+Date.now(),nm:'Новое упражнение',last:''}); save(); const y=window.scrollY; renderPlan(); window.scrollTo(0,y); }
  else if(act==='gymdel'){ const [d,id]=v.split(':'); S.gym[d]=gymList(+d).filter(e=>e.id!==id); save(); const y=window.scrollY; renderPlan(); window.scrollTo(0,y); }
  else if(act==='menu'){ S.ui.menu=v; save(); const y=window.scrollY; renderFood(); window.scrollTo(0,y); }
  else if(act==='shopreset'){ S.shop={}; save(); const y=window.scrollY; renderFood(); window.scrollTo(0,y); toast('Отметки сброшены'); }
  else if(act==='wa'){ const txt = v==='week'? weekReport() : dayReport(viewDate); a.href = waHref(txt); }
  else if(act==='copy'){ copyText(v==='week'? weekReport() : dayReport(viewDate)); }
  else if(act==='gcal'){ S.remind[v]=true; save(); setTimeout(renderRemind,300); }
  else if(act==='unrem'){ delete S.remind[v]; save(); renderRemind(); }
  else if(act==='mdel'){ if(delArm===v){ S.measures=S.measures.filter(m=>m.id!==v); delArm=null; save(); toast('Замер удалён'); } else delArm=v; renderProgress(); }
  else if(act==='backup'){ try{ copyText(btoa(unescape(encodeURIComponent(JSON.stringify(S))))); }catch(err){ toast('Не получилось создать код'); } }
  else if(act==='restore'){
    const code=($('#backup-in').value||'').trim(); if(!code){ toast('Сначала вставь код'); return; }
    if(!restoreArm){ restoreArm=true; const val=code; renderProgress(); $('#backup-in').value=val; return; }
    try{ const data=JSON.parse(decodeURIComponent(escape(atob(code)))); if(!data||typeof data!=='object'||!data.days) throw 0; S=Object.assign({},DEFAULT,data); S.ui=Object.assign({},DEFAULT.ui,data.ui||{}); save(); restoreArm=false; toast('Данные восстановлены'); renderProgress(); }
    catch(err){ restoreArm=false; renderProgress(); toast('Код не подошёл — проверь, что скопирован целиком'); }
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset && (t.dataset.gname||t.dataset.glast)){ const [d,id]=(t.dataset.gname||t.dataset.glast).split(':'); const e=gymList(+d).find(x=>x.id===id); if(e){ if(t.dataset.gname) e.nm=t.value; else e.last=t.value; save(); } }
  else if(t.id==='g-dad'||t.id==='g-mom'){ S[t.id==='g-dad'?'dad':'mom']=t.value; save(); calcGenetic(); }
  else if(t.id==='s-name'){ S.name=t.value.slice(0,30); save(); }
  else if(t.id==='s-phone'){ S.phone=t.value.slice(0,20); save(); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset && t.dataset.shop){ if(t.checked) S.shop[t.dataset.shop]=1; else delete S.shop[t.dataset.shop]; save(); t.closest('label').classList.toggle('got',t.checked); }
  else if(t.id==='s-start' && t.value){ S.start=t.value; save(); toast('Дата старта изменена'); }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='mform') return; e.preventDefault();
  const w=parseFloat(($('#m-weight').value||'').replace(',','.')); if(!(w>0)){ toast('Укажи вес'); return; }
  const h=parseFloat(($('#m-height').value||'').replace(',','.')); const p=$('#m-pull').value;
  const date=$('#m-date').value||todayKey();
  S.measures=S.measures.filter(m=>m.date!==date);
  S.measures.push({id:'m'+Date.now(),date,weight:w,height:h>0?h:null,pull:p===''?null:+p});
  save(); toast('Замер сохранён'); renderProgress();
});

/* ================= СТАРТ ================= */
load();
if(!storageOK) $('#storeWarn').hidden=false;
const h=(location.hash||'').replace('#','');
show(TABS.includes(h)?h:'today');
setInterval(()=>{ if(S.ui.tab==='today' && !document.hidden && document.activeElement.tagName!=='INPUT'){ const y=window.scrollY; renderToday(); window.scrollTo(0,y);} },60000);
})();
</script>

if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
